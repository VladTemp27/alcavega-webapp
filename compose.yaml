services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://admin:password123@mongo:27017/alcavega?authSource=admin
    depends_on:
      - mongo
    networks:
      - alcavega_network
  
  mongo:
    image: mongo:latest
    container_name: alcavega_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=alcavega
    volumes:
      - mongo_data:/data/db
    networks:
      - alcavega_network
  
  mongo-express:
    image: mongo-express:latest
    container_name: alcavega_mongo_express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password123
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongo
    networks:
      - alcavega_network

volumes:
  mongo_data:
  backend_node_modules:

networks:
  alcavega_network:
    driver: bridge